[package]
name = "verovio"
description = "Safe Rust bindings to the Verovio music engraving library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
# Forward sanitizer features to verovio-sys so a workspace-level
# `cargo test -p verovio --features sanitize` actually instruments the C++.
sanitize = ["verovio-sys/sanitize"]
sanitize-thread = ["verovio-sys/sanitize-thread"]

# Rasterize a page's SVG to PNG bytes via `resvg`. Adds ~200 KB compiled
# (resvg + usvg + tiny_skia + their deps). Pure Rust, no system libs.
png = ["dep:resvg"]
# Convert a page's SVG to PDF bytes via `svg2pdf`. Adds `resvg` too
# (svg2pdf builds on it) plus the PDF writer.
pdf = ["dep:svg2pdf", "dep:resvg", "dep:pdf-writer"]

# Offline audio rendering of the rendered SMF using `rustysynth` (pure
# Rust SoundFont 2 synthesizer). The caller provides SF2 bytes — the
# crate does not bundle a SoundFont. Adds rustysynth (~150 KB compiled).
audio = ["dep:rustysynth"]

# Live audio playback through the OS default output device, used only
# by `examples/live_playback.rs`. Pulls in `cpal`, which on Linux links
# to alsa-lib (NixOS users: `nix-shell -p alsa-lib pkg-config`). Off by
# default so `cargo test` on bare environments stays portable.
live-audio = ["audio", "dep:cpal"]

[dependencies]
verovio-sys = { path = "../verovio-sys", version = "0.3.0" }
verovio-data = { path = "../verovio-data", version = "0.3.0" }
cxx.workspace = true
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
midly.workspace = true
roxmltree.workspace = true
resvg = { workspace = true, optional = true }
svg2pdf = { workspace = true, optional = true }
rustysynth = { workspace = true, optional = true }
pdf-writer = { workspace = true, optional = true }
cpal = { version = "0.15", optional = true }

[dev-dependencies]
criterion.workspace = true

[[example]]
name = "live_playback"
required-features = ["live-audio"]

[[bench]]
name = "render"
harness = false
