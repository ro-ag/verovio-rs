# cargo-deny configuration. Run locally with `cargo deny check`.
# CI runs it in .github/workflows/audit.yml.

[advisories]
version = 2
# Fail on any RustSec advisory by default. Add IDs here (with a note) only to
# temporarily accept an advisory that has no fix yet.
ignore = []

[licenses]
version = 2
# verovio-rs itself is LGPL-3.0-or-later; the dependency tree is permissive.
# Add a license here only after confirming it's compatible with redistribution.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
  "LGPL-3.0",
  "LGPL-3.0-or-later",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are a warning (transitive deps often pin different majors),
# not a hard failure.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
