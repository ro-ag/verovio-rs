[workspace]
resolver = "2"
members = ["crates/verovio-sys", "crates/verovio", "crates/verovio-data"]

[workspace.package]
version = "0.3.2"
edition = "2021"
rust-version = "1.85"
license = "LGPL-3.0-or-later"
repository = "https://github.com/ro-ag/verovio-rs"
authors = ["Rodrigo Agurto <12665665+ro-ag@users.noreply.github.com>"]
keywords = ["music", "notation", "mei", "musicxml", "verovio"]
categories = ["multimedia", "rendering"]

[workspace.dependencies]
cxx = "1.0"
cxx-build = "1.0"
cc = "1.2"
include_dir = "0.7"
tempfile = "3.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
criterion = "0.5"
midly = "0.5"
roxmltree = "0.21"
resvg = "0.45"
svg2pdf = "0.13"
rustysynth = "1.3"
pdf-writer = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
