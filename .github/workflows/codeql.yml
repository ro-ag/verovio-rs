name: CodeQL
run-name: CodeQL · ${{ github.event_name }} · ${{ github.head_ref || github.ref_name }}

# Replaces GitHub's default-setup code scanning. Default setup re-scans on
# every push to main, piling a third workflow onto each release. This runs
# only where it adds signal: on PRs (catch issues before merge) and on a
# weekly schedule (catch newly-published advisories). No per-push trigger.
# We intentionally skip c-cpp CodeQL here: the C++ compiler invocations come
# from the vendored upstream Verovio sources, which are not maintained in this
# repository.
#
# NOTE: GitHub's *default* CodeQL setup must be turned OFF for this file to
# take effect without double-scanning (Settings → Code security → CodeQL →
# switch from Default to Advanced, or it was disabled via the API).
on:
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE', 'NOTICE', '.gitignore']
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload CodeQL results
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust uses build-mode `none` (source-based extraction, what CodeQL
          # default setup uses) — autobuild fails on this cargo+cc workspace.
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout (with Verovio submodule)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Install Rust stable
        if: matrix.language != 'actions'
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        with:
          category: "/language:${{ matrix.language }}"
