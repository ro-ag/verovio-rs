name: Audit
run-name: Audit · ${{ github.event_name }} · ${{ github.head_ref || github.ref_name }}

# Supply-chain checks for the dependency tree: RustSec advisories, license
# compatibility, banned/duplicate crates, and source allow-listing (deny.toml).
# Runs on dependency/config changes and weekly (advisories appear over time).
on:
  push:
    branches: [main]
    paths: ['**/Cargo.toml', '**/Cargo.lock', 'deny.toml', '.github/workflows/audit.yml']
  pull_request:
    branches: [main]
    paths: ['**/Cargo.toml', '**/Cargo.lock', 'deny.toml', '.github/workflows/audit.yml']
  schedule:
    - cron: '0 6 * * 2' # Tuesdays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      # No submodule: cargo-deny reads manifests/lockfile only, not the C++ source.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
