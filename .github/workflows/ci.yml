name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supported targets: macOS (native) and NixOS (via nix-shell on a Linux
# runner — GitHub doesn't offer NixOS runners, but `shell.nix` produces
# the same toolchain we develop against). A bare-ubuntu job would be
# redundant: every interesting compiler / linker / sanitizer surface is
# the same one a NixOS developer would run locally, and that's exactly
# what test-nix exercises.

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # sccache is intentionally NOT enabled at the workflow level. The GitHub
  # Actions cache backend that sccache talks to returns transient HTTP 400
  # errors that hard-fail sccache at startup. Swatinem/rust-cache below
  # handles cargo registry + fingerprint caching; mold (Linux) handles
  # link-time speedup. Local dev keeps sccache via shell.nix where the
  # local filesystem cache backend has no such reliability issue.

jobs:
  test-macos:
    name: test (macos-latest)
    runs-on: macos-latest

    steps:
      - name: Checkout (with Verovio submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-latest

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: cargo build
        run: cargo build --workspace --all-targets --verbose

      - name: cargo test
        run: cargo test --workspace --verbose

  test-nix:
    name: test (nix-shell — NixOS dev env)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with Verovio submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache cargo / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nix-shell

      # mold comes from shell.nix and stays on. sccache (also in shell.nix)
      # is disabled per-step in CI: each `nix-shell --run` allocates an
      # ephemeral child TMPDIR that is deleted on shell exit, but the
      # sccache daemon outlives the shell and pins that path as its scratch
      # — so the next step's rustc shims fail with "Failed to create temp
      # dir". Local dev runs everything inside a single long-lived shell
      # and is unaffected. Unsetting RUSTC_WRAPPER/CC/CXX inside --run
      # neutralises sccache without touching shell.nix.
      - name: cargo fmt --check
        run: nix-shell --run "unset RUSTC_WRAPPER CC CXX; cargo fmt --all --check"

      - name: cargo clippy
        run: nix-shell --run "unset RUSTC_WRAPPER CC CXX; cargo clippy --workspace --all-targets"

      - name: cargo build
        run: nix-shell --run "unset RUSTC_WRAPPER CC CXX; cargo build --workspace --all-targets --verbose"

      - name: cargo test
        run: nix-shell --run "unset RUSTC_WRAPPER CC CXX; cargo test --workspace --verbose"

  sanitize:
    name: sanitize (ASan + UBSan, nix-shell)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with Verovio submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache cargo / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sanitize

      # Force clang as the linker driver: stable Rust defaults to rust-lld
      # which doesn't translate `-fsanitize=address` into the ASan-runtime
      # link (rustc-link-arg passes the flag through verbatim). clang's cc
      # driver does, and it knows where its own libclang_rt.* lives.
      # Skip mold here — mold and the cc-driver-managed sanitizer runtime
      # don't combine cleanly; default ld is fast enough for one job.
      #
      # shell.nix doesn't include compiler-rt (UBSan runtime ships as a
      # separate nixpkgs derivation, not bundled with clang) or lld (also
      # a separate derivation in nixpkgs — clang can't find it via PATH
      # alone, fails with "invalid linker name in argument '-fuse-ld=lld'").
      # Extend the dev shell on the fly with `-E` so this stays a CI-only
      # concern — local sanitizer builds are not in shell.nix's contract.
      # RUSTFLAGS is set inside --run because shell.nix exports its own
      # RUSTFLAGS and that overrides any workflow-level `env:` entry.
      # Build and run must both happen inside the *same* nix-shell. A single
      # `cargo test` already does that, but on this Ubuntu runner the produced
      # binary was binding to the host `/lib/x86_64-linux-gnu/libc.so.6` at
      # exec time and dying with `undefined symbol: __nptl_change_stack_perm,
      # version GLIBC_PRIVATE` before any test ran — a mismatch between the
      # Nix-toolchain-linked sanitizer runtime and the host glibc. Splitting
      # into `cargo test --no-run` + `cargo test` inside one nix-shell makes
      # the build/run boundary explicit and keeps both phases under the same
      # toolchain + runtime.
      - name: cargo test (sanitize)
        env:
          # Make ASan failures fatal but readable; halt-on-error keeps the
          # first finding visible without a flood of follow-on noise.
          # detect_leaks=0 because the verovio-data tempdir is deliberately
          # leaked (process-lifetime) and would otherwise be a false-positive
          # LSan report at process exit.
          ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1:print_stats=1:detect_leaks=0"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          nix-shell -E "let pkgs = import <nixpkgs> {}; in (import ./shell.nix { inherit pkgs; }).overrideAttrs (old: { buildInputs = (old.buildInputs or []) ++ [ pkgs.llvmPackages_21.compiler-rt pkgs.llvmPackages_21.lld ]; })" --run '
            unset RUSTC_WRAPPER CC CXX
            export RUSTFLAGS="-C linker=clang -C link-arg=-fuse-ld=lld"

            cargo test --workspace --features verovio/sanitize --no-run --verbose

            cargo test --workspace --features verovio/sanitize --verbose
          '
