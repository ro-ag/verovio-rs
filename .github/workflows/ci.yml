name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # sccache is intentionally NOT enabled at the workflow level. The GitHub
  # Actions cache backend that sccache talks to (`artifactcache.actions
  # .githubusercontent.com`) returns transient HTTP 400 errors which hard-fail
  # sccache at startup and break the whole build. Swatinem/rust-cache below
  # is enough for cargo registry + fingerprint caching; mold (Linux) handles
  # link-time speedup. Local dev keeps sccache via shell.nix where the local
  # filesystem cache backend has no such reliability issue.

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout (with Verovio submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cargo registry + git deps + target fingerprints. The heavy
      # libverovio.a artifact isn't covered — it gets rebuilt each CI run.
      - name: Cache cargo / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      - name: Install mold (Linux only)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      - name: Use mold as Rust linker (Linux only)
        if: runner.os == 'Linux'
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: cargo build
        run: cargo build --workspace --all-targets --verbose

      - name: cargo test
        run: cargo test --workspace --verbose

  test-nix:
    name: test (nix-shell — dev env fidelity)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with Verovio submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache cargo / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nix-shell

      # sccache + mold come from shell.nix. sccache here uses its default
      # local filesystem cache (intra-run only — no GHA backend) so the
      # build can't break on cache-service hiccups.
      - name: cargo fmt --check
        run: nix-shell --run "cargo fmt --all --check"

      - name: cargo clippy
        run: nix-shell --run "cargo clippy --workspace --all-targets"

      - name: cargo build
        run: nix-shell --run "cargo build --workspace --all-targets --verbose"

      - name: cargo test
        run: nix-shell --run "cargo test --workspace --verbose"

      - name: sccache stats
        run: nix-shell --run "sccache --show-stats"
        if: always()

  sanitize:
    name: sanitize (ASan + UBSan, ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with Verovio submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sanitize

      - name: Install mold
        uses: rui314/setup-mold@v1

      - name: Use mold as Rust linker
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      # ASan typically reports "shadow memory range interleaves with an
      # existing memory mapping" on aslr-enabled systems; disable per-test.
      - name: cargo test (sanitize)
        env:
          # Make ASan failures fatal but readable; halt-on-error keeps the
          # first finding visible without a flood of follow-on noise.
          ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1:print_stats=1:detect_leaks=0"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: cargo test --workspace --features verovio/sanitize --verbose
