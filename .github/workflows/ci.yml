name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout (with Verovio submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches the cargo registry, git deps, and target/{debug,release}/build
      # fingerprints. The heavy artifact (libverovio.a, ~300 MB debug) is NOT
      # cached by default — first build on a fresh runner takes ~5-6 min.
      - name: Cache cargo / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: cargo build
        run: cargo build --workspace --all-targets --verbose

      - name: cargo test
        run: cargo test --workspace --verbose

  test-nix:
    name: test (nix-shell — dev env fidelity)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with Verovio submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache cargo / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nix-shell

      - name: cargo fmt --check
        run: nix-shell --run "cargo fmt --all --check"

      - name: cargo clippy
        run: nix-shell --run "cargo clippy --workspace --all-targets"

      - name: cargo build
        run: nix-shell --run "cargo build --workspace --all-targets --verbose"

      - name: cargo test
        run: nix-shell --run "cargo test --workspace --verbose"
