name: CI

# TEMPORARY no-op stub. The real build/test matrix (macOS, Linux x86_64,
# Linux arm64, Windows, ASan/UBSan sanitize) lives in git history at commit
# 4164bfd — restore with:
#   git checkout 4164bfd -- .github/workflows/ci.yml
# Purpose: validate workflow triggers + concurrency + PR-vs-push dedup
# cheaply, without the ~15min Verovio C++ build.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE', 'NOTICE', '.gitignore']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE', 'NOTICE', '.gitignore']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  noop:
    name: noop (stub)
    runs-on: ubuntu-latest
    steps:
      - name: Echo trigger context
        run: |
          echo "event = ${{ github.event_name }}"
          echo "ref   = ${{ github.ref }}"
          echo "sha   = ${{ github.sha }}"
          echo "stub CI — no build/test"
