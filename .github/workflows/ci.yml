name: CI
run-name: CI · ${{ github.event_name }} · ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE', 'NOTICE', '.gitignore', '.github/dependabot.yml']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE', 'NOTICE', '.gitignore', '.github/dependabot.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Collapse superseded runs: a new push to the same PR cancels the old run.
  # Never cancel on main (or tags) so every commit on main gets a full run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Supported targets: macOS (arm64), Linux x86_64, Linux arm64,
# Windows (MSVC). ASan/UBSan run in a separate Linux leg. Local NixOS
# dev uses shell.nix (kept in-repo, not exercised in CI).

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Harden cargo's registry downloads against the runner's intermittent HTTP/2
  # framing errors (seen twice: usvg on arm64, svgtypes on linux-x64). Forcing
  # HTTP/1.1 + retries makes "failed to get <crate> ... HTTP2 framing layer"
  # transient failures go away.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  # Caching: Swatinem/rust-cache handles the cargo registry + Rust dependency
  # fingerprints; hendrikmuhs/ccache-action caches Verovio's C++ objects
  # (sccache variant on Windows for MSVC/cl.exe support) per OS key.

jobs:
  # One matrix leg per target/toolchain combination. Legs differ only in
  # runner, toolchain, and cache keys; the step bodies below are shared:
  #   lint legs     — also run fmt + clippy (macOS only, to lint once)
  #   sanitize leg  — replaces build/test with the Nix ASan/UBSan run
  #   docs leg      — replaces build/test with the docs.rs-mirroring cargo doc
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # Route cc-rs's C++ compiles through the compiler cache (cc-rs splits
    # CC/CXX on whitespace, so "ccache cc" wraps the real compiler). Windows
    # uses sccache: first-class MSVC/cl.exe support; RUSTC_WRAPPER wraps rustc.
    # The sanitize leg sets CC/CXX inside its nix-shell instead (clang).
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      RUSTC_WRAPPER: ${{ matrix.rustc-wrapper }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test (macos-latest)
            runner: macos-latest
            key: macos-latest
            toolchain: stable
            components: rustfmt, clippy
            lint: true
            cc: ccache cc
            cxx: ccache c++
          - name: test (linux-x86_64)
            runner: ubuntu-latest
            key: linux-x86_64
            toolchain: stable
            cc: ccache cc
            cxx: ccache c++
          - name: test (linux-arm64)
            runner: ubuntu-24.04-arm
            key: linux-arm64
            toolchain: stable
            cc: ccache cc
            cxx: ccache c++
          - name: test (windows-latest)
            runner: windows-latest
            key: windows-latest
            toolchain: stable
            variant: sccache
            cc: sccache cl.exe
            cxx: sccache cl.exe
            rustc-wrapper: sccache
          - name: sanitize (ASan + UBSan, nix-shell)
            runner: ubuntu-latest
            key: sanitize
            sanitize: true
          # Library-only build: rust-version applies to the published crates,
          # not the dev-deps (criterion etc.), so --lib avoids pulling
          # toolchain-newer dev-deps. Build-only leg, as before the matrix
          # refactor: cargo test would compile those dev-deps on 1.85.
          # resolver-fallback: this repo tracks no Cargo.lock, so the leg
          # resolves fresh; fallback prefers dependency versions compatible
          # with the declared rust-version instead of failing on crates that
          # later raised their MSRV (cxx 1.0.199 requires rustc 1.88).
          - name: msrv (1.85)
            runner: ubuntu-latest
            key: msrv
            toolchain: 1.85.0
            targets: --lib
            notest: true
            resolver-fallback: true
            cc: ccache cc
            cxx: ccache c++
          - name: docs (docs.rs config)
            runner: ubuntu-latest
            key: docs
            toolchain: nightly
            docs: true
            cc: ccache cc
            cxx: ccache c++

    steps:
      - name: Checkout (with Verovio submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Nix
        if: matrix.sanitize
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # The sanitize leg gets its Rust toolchain from shell.nix instead.
      - name: Install Rust ${{ matrix.toolchain }}
        if: ${{ !matrix.sanitize }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: ${{ matrix.toolchain }}
          components: ${{ matrix.components }}

      - name: Cache cargo / target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ${{ matrix.key }}

      # Cache Verovio's C++ objects. Swatinem/rust-cache prunes workspace-member
      # build output, so the big C++ compile reruns every leg — the compiler
      # cache returns the cached .o instead, keyed on compiler+flags+source
      # (auto-invalidates on a new compiler or new Verovio submodule).
      # verbose:2 prints hit stats.
      - name: Compiler cache (Verovio C++ objects)
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          variant: ${{ matrix.variant || 'ccache' }}
          key: ${{ matrix.key }}
          max-size: 600M
          verbose: 2

      # Put cl.exe (+ INCLUDE/LIB) on PATH. cc-rs normally activates this itself,
      # but overriding CC/CXX to "sccache cl.exe" bypasses that, so cl.exe must
      # already be findable for both cc-rs's family detection and sccache.
      - name: Set up MSVC environment
        if: matrix.variant == 'sccache'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: cargo fmt --check
        if: matrix.lint
        run: cargo fmt --all --check

      - name: cargo clippy
        if: matrix.lint
        run: cargo clippy --workspace --all-targets

      - name: cargo build
        if: ${{ !matrix.sanitize && !matrix.docs }}
        env:
          # fallback only on the msrv leg (see the matrix entry); 'allow' is
          # cargo's default resolution behavior on every other leg.
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: ${{ matrix.resolver-fallback && 'fallback' || 'allow' }}
        run: cargo build --workspace ${{ matrix.targets || '--all-targets' }} --verbose

      - name: cargo test
        if: ${{ !matrix.sanitize && !matrix.docs && !matrix.notest }}
        run: cargo test --workspace --verbose

      # Sanitizer runs under Nix — plain-ubuntu apt-clang cannot link it: stable
      # rustc defaults to rust-lld (drops the -fsanitize runtime), and even
      # clang++ + LLVM lld leaves libclang_rt.asan_cxx's RTTI refs (typeinfo,
      # __dynamic_cast) unresolved against libstdc++ (--as-needed/link ordering).
      # Nix's llvmPackages compiler-rt + lld + clang wrapper resolve all of it.
      # shell.nix gives clang+mold+the Nix-glibc rpath; extend it on the fly with
      # -E to add compiler-rt (ASan/UBSan cxx runtime) and lld (separate drv).
      # Transform RUSTFLAGS in place to PRESERVE shell.nix's Nix-glibc rpath — a
      # bare overwrite makes binaries resolve libc against the host and crash
      # (GLIBC_PRIVATE) before any test runs; swap mold->lld, append -C linker=clang.
      - name: cargo test (sanitize)
        if: matrix.sanitize
        env:
          # Make ASan failures fatal but readable; halt-on-error keeps the
          # first finding visible without a flood of follow-on noise.
          # detect_leaks=0 because the verovio-data tempdir is deliberately
          # leaked (process-lifetime) and would otherwise be a false-positive
          # LSan report at process exit.
          ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1:print_stats=1:detect_leaks=0"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          nix-shell -E "let pkgs = import <nixpkgs> {}; in (import ./shell.nix { inherit pkgs; }).overrideAttrs (old: { buildInputs = (old.buildInputs or []) ++ [ pkgs.llvmPackages_21.compiler-rt pkgs.llvmPackages_21.lld pkgs.ccache ]; })" --run '
            unset RUSTC_WRAPPER
            # Route cc-rs C++ compiles through ccache (the linker stays plain clang
            # via RUSTFLAGS, so only compilation is cached). These exports override
            # any CC/CXX shell.nix sets. CCACHE_DIR comes from the ccache step above.
            export CC="ccache clang" CXX="ccache clang++"
            export RUSTFLAGS="${RUSTFLAGS//-fuse-ld=mold/-fuse-ld=lld} -C linker=clang"
            echo "RUSTFLAGS=$RUSTFLAGS"

            cargo test --workspace --features verovio/sanitize --no-run --verbose

            cargo test --workspace --features verovio/sanitize --verbose

            ccache -s
          '

      # Mirror [package.metadata.docs.rs]: nightly + --cfg docsrs + the documented
      # feature set. -D warnings turns broken intra-doc links into a failure here,
      # before they ship to docs.rs.
      - name: cargo doc (docs.rs settings)
        if: matrix.docs
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"
        run: cargo doc --no-deps -p verovio --features png,pdf,audio

      - name: sccache stats
        if: always() && matrix.variant == 'sccache'
        run: sccache --show-stats

  # Single required status check for branch protection: aggregates the matrix
  # so the protected-branch rule needs one stable context (rename-proof)
  # instead of one name per leg. Fails if any leg failed or was cancelled;
  # passes if all succeeded or were skipped (docs-only paths-ignore run).
  ci-success:
    name: CI Success
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "job results: $results"
          case "$results" in
            *failure*|*cancelled*) echo "::error::a required CI job did not pass"; exit 1 ;;
            *) echo "all required jobs passed" ;;
          esac
