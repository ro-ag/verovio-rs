name: Publish release
run-name: Publish ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize releases; never cancel a publish mid-flight — a half-published
  # release (e.g. verovio-sys up but verovio not) leaves crates.io inconsistent.
  group: publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  publish:
    name: Publish crates
    runs-on: macos-latest
    # Only run on tags pushed to the main branch lineage
    if: github.repository == 'ro-ag/verovio-rs'

    # Route cc-rs's C++ compiles through ccache (cc-rs splits CC/CXX on
    # whitespace, so "ccache cc" wraps the real compiler). The three
    # `cargo publish` calls below each rebuild the verovio-sys C++ stack
    # from scratch — with ccache the second and third builds are cache hits.
    env:
      CC: "ccache cc"
      CXX: "ccache c++"

    steps:
      - name: Checkout (with Verovio submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: stable

      - name: Cache cargo / target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: publish

      # Cache Verovio's C++ objects across the three publishes below (each
      # `cargo publish` repackages and rebuilds) and across runs, keyed the
      # same as rust-cache's shared-key.
      - name: ccache (Verovio C++ objects)
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: publish
          max-size: 600M
          verbose: 2

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CARGO_VER=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="verovio") | .version')
          if [ "$TAG" != "$CARGO_VER" ]; then
            echo "::error::Tag v$TAG does not match Cargo version $CARGO_VER"
            exit 1
          fi

      # No test step here: CI already ran the full suite on this commit (tags
      # are cut from tested main), and each `cargo publish` below re-builds the
      # crate to verify before upload. Re-running the suite would just rebuild
      # Verovio's C++ a third time for the same SHA.

      # Publish order matters: verovio depends on verovio-sys + verovio-data.
      # verovio-data has no dependency on verovio-sys, so the two publish
      # back-to-back; only verovio needs the index to have caught up.
      - name: Publish verovio-sys
        run: cargo publish -p verovio-sys

      - name: Publish verovio-data
        run: cargo publish -p verovio-data

      # Poll the crates.io sparse index instead of a fixed sleep: return as
      # soon as both crates are indexed (typically seconds), fail loudly if
      # indexing stalls for more than 5 minutes.
      - name: Wait for crates.io index
        run: |
          for crate in verovio-sys verovio-data; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg c "$crate" '.packages[] | select(.name==$c) | .version')
            for i in $(seq 1 60); do
              if curl -sf "https://index.crates.io/${crate:0:2}/${crate:2:2}/$crate" \
                | grep -q "\"vers\":\"$version\""; then
                echo "$crate $version indexed"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "::error::$crate $version not indexed after 5 minutes"
                exit 1
              fi
              sleep 5
            done
          done

      - name: Publish verovio
        run: cargo publish -p verovio

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { in_section = 1; next }
            in_section && $0 ~ "^## \\[" { exit }
            in_section { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release notes for $TAG" > /tmp/release-notes.md
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
