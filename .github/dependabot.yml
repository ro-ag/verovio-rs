version: 2
updates:
  # All Rust dependency updates collapse into ONE grouped PR (any update type),
  # so a refresh can't open a PR per crate.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]

  # All GitHub Actions updates collapse into ONE grouped PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # dtolnay/rust-toolchain's @ref is the Rust toolchain (e.g. @1.85.0,
      # @stable, @nightly), NOT an action version. Dependabot otherwise
      # "bumps" @1.85.0 -> @1.100.0 and breaks the MSRV job.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions:
        patterns: ["*"]
