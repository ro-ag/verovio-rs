version: 2
updates:
  # All Rust dependency updates collapse into ONE grouped PR (any update type),
  # so a refresh can't open a PR per crate.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]

  # All GitHub Actions updates collapse into ONE grouped PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
